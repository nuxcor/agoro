name = "agoro-progress"
main = "worker.js"
compatibility_date = "2026-01-01"

# Created once with:
#   wrangler kv namespace create PROGRESS
# then paste the id it prints here.
[[kv_namespaces]]
binding = "PROGRESS"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# SYNC_KEY is a SECRET, never a var — set it with:
#   wrangler secret put SYNC_KEY
